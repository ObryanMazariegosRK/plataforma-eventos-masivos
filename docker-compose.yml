services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eventos_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - eventos

  nginx:
    image: nginx:alpine
    container_name: eventos_nginx
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - eventos

  mysql:
    image: mysql:8.0
    container_name: eventos_mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eventos}
      MYSQL_USER: ${DB_USERNAME:-eventos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - eventos

  redis:
    image: redis:alpine
    container_name: eventos_redis
    networks:
      - eventos

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eventos_queue
    working_dir: /var/www
    command: php artisan queue:work redis --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
      - mysql
    restart: unless-stopped
    networks:
      - eventos

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eventos_scheduler
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - mysql
    restart: unless-stopped
    networks:
      - eventos

  mailpit:
    image: axllent/mailpit:latest
    container_name: eventos_mailpit
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - eventos

  adminer:
    image: adminer:latest
    container_name: eventos_adminer
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    networks:
      - eventos

networks:
  eventos:
    driver: bridge

volumes:
  mysql_data: