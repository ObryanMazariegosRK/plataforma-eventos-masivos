; PHP en producción
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M

; Subidas: igual que en desarrollo (docker/php/subidas.ini) y que nginx (client_max_body_size).
; El banner del catálogo admite hasta 15 MB.
upload_max_filesize = 20M
post_max_size = 22M

; OPcache: el código no cambia dentro del contenedor (cada despliegue crea uno nuevo),
; así que no hace falta revisar los archivos en cada petición
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
