server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    charset utf-8;

    # Igual que post_max_size de PHP: el banner del catálogo admite hasta 15 MB
    client_max_body_size 22M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service worker de las notificaciones push: el navegador siempre debe pedir la versión nueva
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Manifest de la app instalable (partials/iconos.blade.php)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Fotos de eventos y banner subidos: nombre único que nunca se reutiliza, se guardan 30 días
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CSS, JS e imágenes: las vistas los piden con ?v=<fecha del archivo>, así que pueden guardarse
    # mucho tiempo; al cambiar un archivo cambia el ?v= y el navegador baja el nuevo
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "app" se resuelve con el DNS de Docker en cada petición: si el contenedor
        # se recrea (cada despliegue) y cambia de IP, nginx no se queda con la vieja
        resolver 127.0.0.11 valid=10s;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Archivos ocultos (.env, .git...) nunca se sirven
    location ~ /\.(?!well-known) {
        deny all;
    }
}
