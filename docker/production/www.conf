; Trabajadores de PHP-FPM: cuántas peticiones se atienden A LA VEZ (el valor de fábrica es 5).
; Cada página del panel hace varias peticiones a la API; con 5 se formaban en fila.
; Cada trabajador usa como máximo ~60 MB, así que 12 son ~720 MB en el peor caso.
; Si llegan más peticiones que trabajadores libres, esperan en fila unos milisegundos (no se cae).
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Cada trabajador se recicla después de 500 peticiones (evita que la memoria crezca con el tiempo)
pm.max_requests = 500
